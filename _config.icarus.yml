# 配置文件版本
version: 5.1.0
# Icarus 主题风格，可选 "default"（默认）或 "cyberpunk"（赛博朋克）
variant: default
# 网站 Logo 的路径或 URL
logo: /img/logo.svg
# 页面元数据配置
head:
    # 网站图标的 URL 或路径
    favicon: /img/favicon.svg
    # Web 应用清单（Manifest）配置
    # https://developer.mozilla.org/en-US/docs/Web/Manifest
    manifest:
        # Web 应用名称（默认使用站点标题）
        name: 
        # Web 应用显示名称
        # 当空间不足以显示完整名称时使用
        short_name: 
        # Web 应用的启动 URL
        start_url: 
        # 应用的默认主题颜色
        theme_color: 
        # 应用页面在样式表加载完成前显示的
        # 占位背景颜色
        background_color: 
        # 网站首选的显示模式
        display: standalone
        # 可在不同场景下作为应用图标使用的图片文件
        icons:
            -
                # 图片文件路径
                src: ''
                # 由空格分隔的图片尺寸字符串
                sizes: ''
                # 图片媒体类型提示
                type: 
    # Open Graph 元数据
    # https://hexo.io/docs/helpers.html#open-graph
    open_graph:
        # 页面标题（og:title，可选）
        # 大多数情况下建议留空
        title: 
        # 页面类型（og:type，可选）
        # 大多数情况下建议留空
        type: blog
        # 页面 URL（og:url，可选）
        # 大多数情况下建议留空
        url: 
        # 页面封面（og:image，可选）
        # 大多数情况下建议留空
        image: 
        # 站点名称（og:site_name，可选）
        # 大多数情况下建议留空
        site_name: 
        # 页面作者（article:author，可选）
        # 大多数情况下建议留空
        author: 
        # 页面描述（og:description，可选）
        # 大多数情况下建议留空
        description: 
        # Twitter 卡片类型（twitter:card）
        twitter_card: 
        # Twitter 作者 ID（twitter:creator）
        twitter_id: 
        # Twitter 站点账号（twitter:site）
        twitter_site: 
        # Google+ 个人资料链接（已弃用）
        google_plus: 
        # Facebook 管理员 ID
        fb_admins: 
        # Facebook 应用 ID
        fb_app_id: 
    # 页面结构化数据
    # https://developers.google.com/search/docs/guides/intro-structured-data
    structured_data:
        # 页面标题（可选）
        # 大多数情况下建议留空
        title: 
        # 页面描述（可选）
        # 大多数情况下建议留空
        description: 
        # 页面 URL（可选）
        # 大多数情况下建议留空
        url: 
        # 页面作者（article:author，可选）
        # 大多数情况下建议留空
        author: 
        # 页面发布者（可选）
        # 大多数情况下建议留空
        publisher: 
        # 页面发布者 Logo（可选）
        # 大多数情况下建议留空
        publisher_logo: 
        # 页面图片（可选）
        # 大多数情况下建议留空
        image: 
    # 额外的 HTML meta 标签数组
    meta:
        # meta 标签使用 <attribute>=<value> 的格式指定
        # 例如：name=theme-color;content=#123456 => <meta name="theme-color" content="#123456">
        - ''
    # 网站 RSS atom.xml 的 URL 或路径
    rss: 
# 页面顶部导航栏配置
navbar:
    # 导航菜单项
    menu:
        首页: /
        时间轴: /archives
        分类: /categories
        标签: /tags
        关于: /about
    # 显示在导航栏右侧的链接
    links:
        Download on GitHub:
            icon: fab fa-github
            url: https://github.com/ppoffice/hexo-theme-icarus
# 页面页脚配置
footer:
    # 版权文字
    copyright: © 2019
    # 显示在页脚区域右侧的链接
    links:
        Creative Commons:
            icon: fab fa-creative-commons
            url: https://creativecommons.org/
        Attribution 4.0 International:
            icon: fab fa-creative-commons-by
            url: https://creativecommons.org/licenses/by/4.0/
        Download on GitHub:
            icon: fab fa-github
            url: https://github.com/ppoffice/hexo-theme-icarus
# 文章相关配置
article:
    # 代码高亮设置
    highlight:
        # 代码高亮主题
        # https://github.com/highlightjs/highlight.js/tree/master/src/styles
        theme: atom-one-light
        # 显示“复制代码”按钮
        clipboard: true
        # 代码块默认折叠状态，可为 ""、"folded" 或 "unfolded"
        fold: unfolded
    # 是否显示预计文章阅读时间
    readtime: true
    # 是否显示更新时间。设为 "auto" 时，仅当 page.updated 已设置且与 page.date 不同时显示文章更新时间
    update_time: true
    # 文章许可协议区块
    licenses:
        Creative Commons:
            icon: fab fa-creative-commons
            url: https://creativecommons.org/
        Attribution:
            icon: fab fa-creative-commons-by
            url: https://creativecommons.org/licenses/by/4.0/
        Noncommercial:
            icon: fab fa-creative-commons-nc
            url: https://creativecommons.org/licenses/by-nc/4.0/
# 搜索插件配置
# https://ppoffice.github.io/hexo-theme-icarus/categories/Plugins/Search/
search:
    type: insight
    # 是否在搜索结果中包含独立页面
    index_pages: false
# 评论插件配置
# https://ppoffice.github.io/hexo-theme-icarus/categories/Plugins/Comment/
# comment:
#     type: disqus
#     # Disqus 短名称（shortname）
#     shortname: ''
# # 赞助/捐赠插件配置
# # https://ppoffice.github.io/hexo-theme-icarus/categories/Plugins/Donation/
# donates:
#     # "Afdian.net"（爱发电）赞助按钮配置
#     -
#         type: afdian
#         # "Afdian.net"（爱发电）个人主页 URL
#         url: ''
#     # 支付宝赞助按钮配置
#     -
#         type: alipay
#         # 支付宝二维码图片 URL
#         qrcode: ''
#     # "Buy me a coffee" 赞助按钮配置
#     -
#         type: buymeacoffee
#         # "Buy me a coffee" 页面 URL
#         url: ''
#     # Patreon 赞助按钮配置
#     -
#         type: patreon
#         # Patreon 页面 URL
#         url: ''
#     # PayPal 赞助按钮配置
#     -
#         type: paypal
#         # PayPal 商家 ID 或邮箱地址
#         business: ''
#         # 货币代码
#         currency_code: USD
#     # 微信赞助按钮配置
#     -
#         type: wechat
#         # 微信二维码图片 URL
#         qrcode: ''
# # 分享插件配置
# # https://ppoffice.github.io/hexo-theme-icarus/categories/Plugins/Share/
# share:
#     type: sharethis
#     # ShareThis 分享插件脚本的 URL
#     install_url: ''
# 侧边栏配置。
# 请注意：只有当侧边栏至少包含一个小组件时才会显示
sidebar:
    # 左侧边栏配置
    left:
        # 页面滚动时侧边栏是否固定在顶部
        sticky: True
    # 右侧边栏配置
    right:
        # 页面滚动时侧边栏是否固定在顶部
        sticky: True
# 侧边栏小组件配置
# http://ppoffice.github.io/hexo-theme-icarus/categories/Widgets/
widgets:
    # 个人资料小组件配置
    -
        # 小组件放置位置：左侧边栏或右侧边栏
        position: left
        type: profile
        # 作者名称
        author: Ataimaitai
        # 作者头衔
        author_title: Teenager
        # 作者当前所在地
        location: Hunan, China
        # 头像图片的 URL 或路径
        avatar: 
        # 是否显示圆形头像
        avatar_rounded: false
        # 用于 Gravatar 的邮箱地址
        gravatar: 
        # “关注”按钮的 URL 或路径
        follow_link: https://github.com/ataimaitai
        # 显示在个人资料小组件底部的链接
        social_links:
            Github:
                icon: fab fa-github
                url: https://github.com/ataimaitai
            Facebook:
                icon: fab fa-facebook
                url: https://facebook.com
            Twitter:
                icon: fab fa-twitter
                url: https://twitter.com
            Dribbble:
                icon: fab fa-dribbble
                url: https://dribbble.com
            RSS:
                icon: fas fa-rss
                url: /
    # 文章目录小组件配置
    -
        # 小组件放置位置：左侧边栏或右侧边栏
        position: left
        type: toc
        # 是否显示各级标题的序号
        index: true
        # 子标题离开可视区域后是否自动折叠
        collapsed: true
        # 显示标题的最大层级（1–6）
        depth: 3
    # 推荐链接小组件配置
    -
        # 小组件放置位置：左侧边栏或右侧边栏
        position: left
        type: links
        # 站点名称及 URL
        links:
            Hexo: https://hexo.io
            Bulma: https://bulma.io
    # 分类小组件配置
    -
        # 小组件放置位置：左侧边栏或右侧边栏
        position: left
        type: categories
    # 最近文章小组件配置
    -
        # 小组件放置位置：左侧边栏或右侧边栏
        position: left
        type: recent_posts
    # 归档小组件配置
    -
        # 小组件放置位置：左侧边栏或右侧边栏
        position: left
        type: archives
    # 标签小组件配置
    -
        # 小组件放置位置：左侧边栏或右侧边栏
        position: left
        type: tags
        # 标签排序方式。例如，'name' 表示按名称升序排列，'-length' 表示按各标签下文章数量降序排列
        order_by: name
        # 显示的标签数量。未设置时显示全部标签。
        amount: 
        # 是否显示标签计数，即该标签下的文章数量。
        show_count: true
    # Google FeedBurner 邮件订阅小组件配置
    -
        # 小组件放置位置：左侧边栏或右侧边栏
        position: left
        type: subscribe_email
        # 邮箱输入框下方的提示文字
        description: 
        # FeedBurner ID
        feedburner_id: ''
    # Google AdSense 广告单元配置
    # -
    #     # 小组件放置位置：左侧边栏或右侧边栏
    #     position: left
    #     type: adsense
    #     # AdSense 客户端 ID
    #     client_id: ''
    #     # AdSense 广告单元 ID
    #     slot_id: ''
    # Follow.it 邮件订阅小组件配置
    -
        # 小组件放置位置：左侧边栏或右侧边栏
        position: left
        type: followit
        # 邮箱输入框下方的提示文字
        description: 
        # 订阅表单提交 URL
        action_url: ''
        # Feed 所有权验证代码
        verification_code: ''
# 插件配置
# https://ppoffice.github.io/hexo-theme-icarus/categories/Plugins/
plugins:
    # 启用页面启动动画
    animejs: true
    # 显示“返回顶部”按钮
    back_to_top: true
    # 百度统计插件设置
    # https://tongji.baidu.com
    baidu_analytics:
        # 百度统计跟踪 ID
        tracking_id: 
    # Bing 网站管理员工具插件设置
    # https://www.bing.com/toolbox/webmaster/
    bing_webmaster:
        # <meta> 标签中的 Bing 网站管理员工具跟踪 ID
        tracking_id: 
    # 不蒜子站点/页面访问量计数器
    # https://busuanzi.ibruce.info
    busuanzi: false
    # CNZZ 统计
    # https://www.umeng.com/web
    cnzz:
        # CNZZ 跟踪器 ID
        id: 
        # CNZZ 网站 ID
        web_id: 
    # 提示用户网站使用 Cookie
    # https://www.osano.com/cookieconsent/
    cookie_consent:
        # 合规类型，可为 "info"、"opt-in" 或 "opt-out"
        type: info
        # 弹窗主题，可为 "block"、"edgeless" 或 "classic"
        theme: edgeless
        # 无论页面是否滚动，弹窗是否保持固定位置
        static: false
        # Cookie 同意弹窗在屏幕上的显示位置
        position: bottom-left
        # 网站 Cookie 政策页面的 URL
        policyLink: https://www.cookiesandyou.com/
    # 启用 lightGallery 和 Justified Gallery 插件
    gallery: true
    # Google Analytics 插件设置
    # https://analytics.google.com
    google_analytics:
        # Google Analytics 跟踪 ID
        tracking_id: 
    # Hotjar 用户反馈插件
    # https://www.hotjar.com/
    hotjar:
        # Hotjar 站点 ID
        site_id: 
    # 启用 KaTeX 数学公式排版支持
    # https://katex.org/
    katex: false
    # 启用 MathJax 数学公式排版支持
    # https://www.mathjax.org/
    mathjax: false
    # 启用 Outdated Browser 插件
    # http://outdatedbrowser.com/
    outdated_browser: false
    # 启用 PJAX
    pjax: true
    # 页面加载时在顶部显示进度条
    progressbar: true
    # Statcounter 统计
    # https://statcounter.com/
    statcounter:
        # Statcounter 项目 ID
        project: 
        # Statcounter 项目安全代码
        security: 
    # Twitter 转化跟踪插件设置
    # https://business.twitter.com/en/help/campaign-measurement-and-analytics/conversion-tracking-for-websites.html
    twitter_conversion_tracking:
        # Twitter Pixel ID
        pixel_id: 
# CDN 服务提供商设置
# https://ppoffice.github.io/hexo-theme-icarus/Configuration/Theme/speed-up-your-site-with-custom-cdn/
providers:
    # JavaScript 和/或样式表 CDN 服务商的名称或 URL 模板
    cdn: jsdelivr
    # Web 字体 CDN 服务商的名称或 URL 模板
    fontcdn: google
    # Font Awesome 图标字体 CDN 服务商的名称或 URL
    iconcdn: fontawesome
